[project]
name = "friday-engine-research"
version = "0.1.0"
description = "Friday v3 scheduling engine research: Boltzmann/energy-based model vs the v2 CP-SAT baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "numba",
  "scipy",
  "ortools",
  "pandas",
  "matplotlib",
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest", "hypothesis", "cvxpy", "osqp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
