[project]
name = "friday"
version = "0.1.0"
description = "A self-hosted calendar and to-do app that decides when things get done"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "numba",
  "ortools",
  "pydantic>=2",
  "python-dateutil>=2.9.0.post0",
  "rapidfuzz>=3.14.6",
  "tomli-w>=1.2.0",
  "fastapi>=0.146.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "typer>=0.27.3",
  "rich>=15.0.0",
  "scipy>=1.18.1",
  "icalendar>=7.3.0",
  "anthropic>=1.15.0",
  "google-auth-oauthlib>=1.5.0",
  "google-api-python-client>=2.201.0",
  "mcp>=2.3.0",
  "webauthn>=3.0.1",
]

[project.scripts]
friday = "friday.cli.main:main"
fridayd = "friday.server.main:main"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import from src/ directly, not through the editable install, whose .pth file macOS can mark hidden.
pythonpath = ["src", "."]
addopts = "-q"
# OR-Tools' SWIG wrappers (pywraplp, used by the allocator) warn on import under Python 3.12.
# Starlette's TestClient asks for `httpx2`; plain httpx works and is the one DESIGN §4.2 lists.
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference", ".claude", "BackendGuidelines", "UI"]  # the research engine and the Mac app keep their own style

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A literal word list split on spaces reads better than fifty quoted strings.
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
# The kernel model names its array dimensions I, S, D, M, G, as the design does.
"src/friday/engine/compile.py" = ["E741"]
