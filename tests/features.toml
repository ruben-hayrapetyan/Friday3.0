# Every feature of Friday and what it is made of (24 Nov, the user: "go through every single functionality of the
# app and build an extensive test suite (both web, headless, and regular)"). tests/test_features.py checks every
# command and query belongs to a feature here, and every feature has its tests in each layer (TESTING.md).
# `commands`: the commands and queries it runs; `pages`: where it is in the app (none: no page of its own).

